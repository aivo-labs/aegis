static_resources:
  listeners:
  - name: listener_edge_gate
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8443
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          route_config:
            name: local_route
            virtual_hosts:
            - name: aegis_protected_services
              domains: ["*"]
              routes:
              - match:
                  prefix: "/api/v1/protected"
                route:
                  cluster: internal_pme_backend
          http_filters:
          # Filtre External Authorization gRPC connecté au PEP Authorino
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              grpc_service:
                envoy_grpc:
                  cluster_name: authorino_pep_cluster
                timeout: 0.25s
              transport_api_version: V3
              with_request_body:
                max_request_bytes: 1024
                pack_as_bytes: true
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # Cluster Authorino PEP (Policy Enforcement Point)
  - name: authorino_pep_cluster
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: authorino_pep_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: aegis-authorino
                port_value: 50001

  # Cluster de l'application PME interne sous-jacente
  - name: internal_pme_backend
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: internal_pme_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 8000
