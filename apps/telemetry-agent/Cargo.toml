[package]
name = "aegis-telemetry-agent"
version = "0.1.0"
edition = "2021"
authors = ["Nicolas BAUD <nicolas@aivo.fr>"]
description = "Agent de télémétrie énergétique bas-niveau pour Aegis Gate (Scaphandre -> TimescaleDB)"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
hostname = "0.4"
