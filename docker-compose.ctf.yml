# =============================================================================
# ⚔️ AEGIS BY AIVO — NŒUD EDGE CTF GOOGLE CLOUD (ctf.aegis.aivo.fr)
# Rattaché en temps réel à ton Cockpit Central : https://aegis.aivo.fr
#
# Architecture :
# - ZÉRO base de données ni interface d'admin sur la VM CTF (100% Stateless Edge Node)
# - Empreinte ultra-frugale (~45 Mo RAM — tourne sur une VM gratuite GCP e2-micro)
# - Certificat TLS Let's Encrypt automatique via Caddy 2 intégré (:80 / :443)
# - Télémétrie Ingress WAF, Egress OAST, Bans Auto-Jail & Énergie remontés en direct
#   sur https://aegis.aivo.fr (avec synchronisation bidirectionnelle toutes les 3s)
#
# Déploiement en 1 commande sur la VM Google Cloud :
#   CTF_DOMAIN=ctf.aegis.aivo.fr \
#   AEGIS_CONTROL_PLANE_URL=https://aegis.aivo.fr \
#   AEGIS_ENROLL_TOKEN=aegis_tok_live_xxx \
#   docker compose -f docker-compose.ctf.yml up -d --build
# =============================================================================

version: '3.8'

services:
  # 1. BOUCLIER AEGIS GATE PEP v1.3 (MODE EDGE + ARÈNE CTF /ctf & /api/v1/ctf/flag)
  gate-proxy:
    build:
      context: ./apps/gate-proxy
      dockerfile: Dockerfile
    container_name: aegis_ctf_gate_proxy
    restart: always
    environment:
      GATE_PORT: 8000
      AEGIS_NODE_MODE: "edge"
      AEGIS_CTF_MODE: "true"
      AEGIS_NODE_HOSTNAME: "${CTF_DOMAIN:-ctf.aegis.aivo.fr}"
      BACKEND_URL: "${AEGIS_CONTROL_PLANE_URL:-https://aegis.aivo.fr}"
      WEB_URL: "http://127.0.0.1:8000"
      EGRESS_GATEWAY_URL: "http://egress-gateway:5053"
      AEGIS_GATE_API_URL: "${AEGIS_CONTROL_PLANE_URL:-https://aegis.aivo.fr}/api/v1/gate/telemetry/ingress"
      AEGIS_TENANT_ID: "${AEGIS_TENANT_ID:-00000000-0000-0000-0000-000000000001}"
      AEGIS_EXEMPT_IPS: "${AEGIS_EXEMPT_IPS:-}"
      AEGIS_TARPIT_ENABLED: "${AEGIS_TARPIT_ENABLED:-true}"
      AEGIS_STEALTH_BLOCK: "${AEGIS_STEALTH_BLOCK:-true}"
      AEGIS_ALLOW_DEMO_AUTH: "false"
      AEGIS_INTERNAL_TOKEN: "${AEGIS_INTERNAL_TOKEN:-}"
      BFF_SESSION_SECRET: "${BFF_SESSION_SECRET:-}"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - aegis-ctf-edge

  # 2. PASSERELLE SORTANTE AEGIS EGRESS (SINKHOLE OAST interact.sh / oast.pro & LOTC)
  egress-gateway:
    build:
      context: ./apps/egress-gateway
      dockerfile: Dockerfile
    container_name: aegis_ctf_egress_gateway
    restart: always
    environment:
      AEGIS_TENANT_ID: "${AEGIS_TENANT_ID:-00000000-0000-0000-0000-000000000001}"
      AEGIS_GATE_API_URL: "${AEGIS_CONTROL_PLANE_URL:-https://aegis.aivo.fr}/api/v1/gate/telemetry/egress"
      SYSTEMONE_API_URL: "http://localhost:11434/mock"
      SYSTEMONE_MODEL_NAME: "nimble"
      EGRESS_LISTEN_PORT: 5053
    ports:
      - "127.0.0.1:5053:5053/udp"
      - "127.0.0.1:5053:5053/tcp"
    networks:
      - aegis-ctf-edge

  # 3. AGENT DE TÉLÉMÉTRIE ÉNERGÉTIQUE & ANTI-SPAWN SHELL RUST (ENRÔLEMENT AUTO SUR aegis.aivo.fr)
  telemetry-agent:
    build:
      context: ./apps/telemetry-agent
      dockerfile: Dockerfile
    container_name: aegis_ctf_telemetry_agent
    restart: always
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    hostname: "${CTF_DOMAIN:-ctf.aegis.aivo.fr}"
    environment:
      AEGIS_TENANT_ID: "${AEGIS_TENANT_ID:-00000000-0000-0000-0000-000000000001}"
      AEGIS_SERVER_ID: "${CTF_DOMAIN:-ctf.aegis.aivo.fr}"
      AEGIS_GATE_API_URL: "${AEGIS_CONTROL_PLANE_URL:-https://aegis.aivo.fr}/api/v1/gate/telemetry/energy"
      AEGIS_GATE_API_KEY: "${AEGIS_ENROLL_TOKEN:-aegis_tok_live_ctf_gcp}"
      POLL_INTERVAL_SECS: "5"
    networks:
      - aegis-ctf-edge

  # 4. TERMINAISON TLS AUTOMATIQUE (LET'S ENCRYPT HTTPS POUR ctf.aegis.aivo.fr)
  caddy-tls:
    image: caddy:2-alpine
    container_name: aegis_ctf_tls_proxy
    restart: always
    command: ["caddy", "reverse-proxy", "--from", "${CTF_DOMAIN:-ctf.aegis.aivo.fr}", "--to", "gate-proxy:8000"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - aegis_ctf_caddy_data:/data
      - aegis_ctf_caddy_config:/config
    networks:
      - aegis-ctf-edge
    depends_on:
      - gate-proxy
    links:
      - gate-proxy:gate-proxy

volumes:
  aegis_ctf_caddy_data:
  aegis_ctf_caddy_config:

networks:
  aegis-ctf-edge:
    driver: bridge
