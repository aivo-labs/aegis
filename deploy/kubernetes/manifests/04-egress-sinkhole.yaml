apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-coredns-sinkhole-rules
  namespace: aegis-system
data:
  sinkhole.hosts: |
    # Domaines malveillants identifiés par Nimble 9B & AnSSI Threat Feeds
    0.0.0.0 c2-attacker.ru
    0.0.0.0 exfiltration.evilcorp.com
    0.0.0.0 bad-actor.onion.to
    0.0.0.0 botnet-control.xyz
    0.0.0.0 ransom-payment.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-coredns-sinkhole-config
  namespace: aegis-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        hosts /etc/coredns/sinkhole.hosts {
            fallthrough
        }
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-egress-forwarder
  namespace: aegis-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-egress-forwarder
  template:
    metadata:
      labels:
        app: aegis-egress-forwarder
    spec:
      containers:
        - name: forwarder
          image: coredns/coredns:1.11.3
          args: [ "-conf", "/etc/coredns/Corefile" ]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
      volumes:
        - name: config-volume
          configMap:
            name: aegis-coredns-sinkhole-config
            items:
              - key: Corefile
                path: Corefile
